[project]
name = "forestwatch-backend"
version = "0.1.0"
description = "Reproducible RADARSAT-2 change analysis and a local presentation API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "rasterio>=1.4,<2",
    "shapely>=2,<3",
    "pyproj>=3.6,<4",
    "pillow>=10,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
